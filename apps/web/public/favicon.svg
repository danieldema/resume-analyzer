<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#1d4ed8"/>
  <!-- needle body -->
  <line x1="7" y1="25" x2="21" y2="8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- needle point (sharp tip at bottom-left is implicit from stroke-linecap) -->
  <!-- needle eye near top -->
  <ellipse cx="20" cy="9" rx="2.2" ry="1.3" fill="#1d4ed8" stroke="white" stroke-width="1.2" transform="rotate(-47 20 9)"/>
  <!-- thread -->
  <path d="M 24 6 C 21 10 18 15 15 20 C 12 24 10 26 9 27" stroke="#93c5fd" stroke-width="1.8" stroke-linecap="round" fill="none"/>
</svg>
