<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#2563eb"/>

  <!-- Spool: top flange -->
  <rect x="3" y="6" width="14" height="4" rx="1.5" fill="white" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Spool: barrel -->
  <rect x="6" y="10" width="8" height="11" fill="white" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Spool: bottom flange -->
  <rect x="3" y="21" width="14" height="4" rx="1.5" fill="white" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Needle body: rounded top (blunt/eye end), narrows to point at bottom -->
  <path d="M 22 9 Q 22 7 24 7 Q 26 7 26 9 L 25.5 22 L 24 27 L 22.5 22 Z"
        fill="white" stroke="#111" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Needle eye -->
  <ellipse cx="24" cy="10" rx="1.2" ry="0.9" fill="#2563eb" stroke="#111" stroke-width="1"/>
</svg>
